<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bar Discoteca</title>

<link rel="stylesheet" href="css/styles.css">

</head>

<body>
<div class="disco-lights">

<div class="light light1"></div>
<div class="light light2"></div>
<div class="light light3"></div>
<div class="light light4"></div>

</div>
<div class="particles"></div>

<header>

<div class="logo-container">
<img src="images/logo.png" class="logo">
<h1>BAR DISCOTECA</h1>
</div>

<nav>
<a href="#galeria">Galería</a>
<a href="#carta">Carta</a>
<a href="#reservas">Reservas</a>
</nav>

</header>

<section id="hero">

<h2>La mejor rumba de la ciudad</h2>
<p>Torneos de bolirana • Eventos deportivos • Música • Tragos</p>

</section>


<section id="galeria">

<h2>Ambiente</h2>

<div class="carousel">

<div class="slides">

<img src="images/foto1.jpg">
<img src="images/foto2.jpg">
<img src="images/foto3.jpg">

<video controls>
<source src="videos/video1.mp4" type="video/mp4">
</video>

</div>

</div>

</section>


<section id="carta">

<h2>Nuestra Carta</h2>

<img src="images/carta.jpg" class="menu">

</section>


<section id="reservas">

<h2>Reservas</h2>

<form>

<input type="text" placeholder="Nombre" required>

<input type="tel" placeholder="Teléfono" required>

<input type="date" required>

<textarea placeholder="Mensaje"></textarea>

<button type="submit">Reservar</button>

</form>

</section>

<section id="ubicacion">

<h2>Ubicación</h2>

<iframe
src="https://www.google.com/maps?q=Bogota&output=embed"
width="100%"
height="400"
style="border:0;"
allowfullscreen=""
loading="lazy">
</iframe>

</section>
<footer>

<p>© 2026 Bar Discoteca</p>

</footer>


<script src="js/script.js"></script>

</body>
</html>
