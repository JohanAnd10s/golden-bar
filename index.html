<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden Bar y Boliranas</title>

<link rel="stylesheet" href="css/styles.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

</head>

<body>

<header>

<div class="logo-container">

<img src="logo.png" class="logo-img">

<h1>Golden Bar</h1>

</div>

<nav>
<a href="#galeria">Galería</a>
<a href="#carta">Carta</a>
<a href="#reservas">Reservas</a>
</nav>

</header>


<section class="hero">

<div class="overlay"></div>

<div class="hero-content">

<h2>Rumba, Boliranas y Buen Ambiente</h2>

<button onclick="scrollToReservas()">Reservar Mesa</button>

</div>

</section>


<section id="galeria" class="carrusel">

<h2>Ambiente Golden</h2>

<div class="slider">

<img src="img1.jpg" class="slide active">

<img src="img2.jpg" class="slide">

<video class="slide" muted loop>

<source src="video.mp4" type="video/mp4">

</video>

</div>

</section>


<section id="carta" class="carta">

<h2>Nuestra Carta</h2>

<img src="carta.jpg" class="menu-img">

</section>


<section id="reservas" class="reservas">

<h2>Reserva tu Mesa</h2>

<div class="form">

<input type="text" id="nombre" placeholder="Nombre">

<input type="number" id="personas" placeholder="Personas">

<input type="date" id="fecha">

<input type="time" id="hora">

<button onclick="reservar()">Reservar por WhatsApp</button>

</div>

</section>


<a href="https://wa.me/573000000000" class="whatsapp">💬</a>


<footer>

<p>© 2026 Golden Bar y Boliranas</p>

</footer>

<script src="js/script.js"></script>

</body>
</html>
