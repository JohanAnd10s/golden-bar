<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden Bar</title>

<link rel="stylesheet" href="css/styles.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

</head>

<body>

<header>

<div class="logo-container">
<img src="imagenes/LogoGolden.png" class="logo-img">
<span class="logo-text">GOLDEN BAR</span>
</div>

<div class="menu-btn" id="menu-btn">
<span></span>
<span></span>
<span></span>
</div>

<nav id="nav">
<a href="#hero">Inicio</a>
<a href="#galeria">Galería</a>
<a href="#eventos">Eventos</a>
<a href="#catalogo">Carta</a>
<a href="#reservas">Reservas</a>
</nav>

</header>


<main class="scroll-container">


<section id="hero" class="panel hero">

<div class="content">

<h2>GOLDEN NOCHES DORADAS MOMENTOS INOLVIDABLES</h2>

<button onclick="scrollToReservas()">Reservar Mesa</button>

</div>

</section>

<section id="galeria" class="panel galeria">

<h2 class="titulo-seccion">GALERÍA</h2>

<div class="galeria-scroll">

<img src="imagenes/GaleriaImg1.jpg" class="galeria-item">

<video class="galeria-item" autoplay muted loop playsinline>
<source src="videos/GaleriaVid1.mp4" type="video/mp4">
</video>

<img src="imagenes/GaleriaImg2.jpg" class="galeria-item">

<video class="galeria-item" autoplay muted loop playsinline>
<source src="videos/GaleriaVid5.mp4" type="video/mp4">
</video>

<img src="imagenes/GaleriaImg3.jpg" class="galeria-item">

<img src="imagenes/GaleriaVid2.jpg" class="galeria-item">

<video class="galeria-item" autoplay muted loop playsinline>
<source src="videos/GaleriaVid3.mp4" type="video/mp4">
</video>

</div>

</section>




<section id="eventos" class="panel">

<h2>Eventos de la Semana</h2>

<div class="cards">

<div class="card">🍻 Martes de Cubetazo</div>

<div class="card">🎯 Jueves de Bolirana</div>

<div class="card">🎧 Viernes DJ Invitado</div>

<div class="card">🎤 Sábado Artistas En Vivo</div>

</div>

</section>



<section id="catalogo" class="panel catalogo">

<h2>Nuestra Carta</h2>

<div class="menu-grid">

<img src="imagenes/CartaGoldenCombos.png" class="menu-img">
<img src="imagenes/CartaGoldenPrecios.png" class="menu-img">

</div>

</section>



<section id="reservas" class="panel reservas">

<h2>Reserva tu Mesa</h2>

<input type="text" id="nombre" placeholder="Nombre">

<input type="number" id="personas" placeholder="Personas">

<input type="date" id="fecha">

<input type="time" id="hora">

<button onclick="reservar()">Reservar por WhatsApp</button>

</section>


</main>


<footer>

<p>© 2026 Golden Bar</p>

</footer>

<div id="lightbox">
<img id="lightbox-img">
</div>
<script src="js/script.js"></script>

</body>

</html>
